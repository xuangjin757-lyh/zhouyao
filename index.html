<style>
  :root{
    --gold:#e2c38b;
    --cream:#efe6d6;
    --ink:#0a1522;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(120% 80% at 20% 100%, rgba(190,140,70,.12), transparent 60%),
      radial-gradient(90% 60% at 85% 5%, rgba(110,150,195,.10), transparent 60%),
      linear-gradient(180deg,#081320 0%,#0d1b2a 45%,#152838 100%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(75% 65% at 50% 45%, transparent 45%, rgba(3,8,14,.55) 100%);
  }

  /* ---------- 滚动容器 ---------- */
  .scroller{
    position:fixed;inset:0;
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    z-index:2;
  }
  body:not(.open) .scroller{overflow:hidden}

  .page{
    position:relative;
    height:100vh;height:100dvh;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    scroll-snap-align:center;scroll-snap-stop:always;
    padding:16px;
  }
  .page.last{gap:8px}

  /* ---------- 第一页：信 ---------- */
  .glow{
    position:absolute;width:78vmin;height:78vmin;border-radius:50%;
    background:radial-gradient(circle, rgba(226,195,139,.16), rgba(226,195,139,0) 62%);
    filter:blur(6px);opacity:0;transition:opacity 1.4s ease .35s;
  }
  body.open .glow{opacity:1}

  .cardwrap{
    position:relative;
    width:min(64.5vh, 91.5vw);
    height:min(86vh, 122vw);
    width:min(64.5dvh, 91.5vw);
    height:min(86dvh, 122vw);
    aspect-ratio:3 / 4;
    transform:scale(.94);
    filter:blur(30px) brightness(.36) saturate(1.2);
    transition:transform 1.15s cubic-bezier(.19,.7,.25,1), filter 1.15s ease;
    will-change:transform,filter;
  }
  .cardwrap img{
    display:block;width:100%;height:100%;object-fit:contain;
    border-radius:2px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
  }
  body.open .cardwrap{transform:scale(1);filter:none}

  .cover{
    position:absolute;inset:0;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .75s ease, transform .75s ease;
  }
  body.open .cover{opacity:0;transform:scale(1.04);pointer-events:none}

  .eyebrow{
    font-size:13px;letter-spacing:.42em;text-indent:.42em;
    color:var(--gold);opacity:.92;margin-bottom:34px;
    text-shadow:0 1px 14px rgba(0,0,0,.65), 0 0 3px rgba(0,0,0,.5);
  }

  .seal{
    width:84px;height:84px;border-radius:5px;
    background:linear-gradient(150deg,#b03a31,#8e2a24);
    color:#fbf1e2;font-family:"STXingkai","华文行楷","Kaiti SC","KaiTi",serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:27px;line-height:1.02;letter-spacing:.04em;
    transform:rotate(-6deg);
    box-shadow:0 8px 26px rgba(140,40,30,.45), inset 0 0 22px rgba(0,0,0,.22);
    animation:breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:rotate(-6deg) scale(1);box-shadow:0 8px 26px rgba(140,40,30,.38), inset 0 0 22px rgba(0,0,0,.22)}
    50%{transform:rotate(-6deg) scale(1.045);box-shadow:0 12px 34px rgba(160,50,38,.5), inset 0 0 22px rgba(0,0,0,.22)}
  }
  .seal.small{
    width:54px;height:54px;font-size:17px;border-radius:4px;opacity:.85;
    animation:none;box-shadow:0 6px 16px rgba(0,0,0,.35);
  }

  .hint{
    margin-top:30px;font-size:14.5px;font-weight:500;letter-spacing:.3em;text-indent:.3em;
    color:rgba(247,232,203,.96);
    text-shadow:0 1px 10px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.7);
    animation:fade 3.6s ease-in-out infinite;
  }
  @keyframes fade{0%,100%{opacity:.45}50%{opacity:.95}}

  .after{
    position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 96px);
    text-align:center;font-size:12.5px;letter-spacing:.22em;
    color:rgba(226,195,139,.62);
    opacity:0;transform:translateY(8px);
    transition:opacity 1s ease 1.05s, transform 1s ease 1.05s;
    z-index:3;pointer-events:none;
  }
  body.open .after{opacity:1;transform:none}

  /* ---------- 短章页 ---------- */
  .verse{
    display:block;
    max-width:80vw;max-height:64vh;
    max-height:64dvh;
    width:auto;height:auto;
    filter:drop-shadow(0 6px 26px rgba(0,0,0,.5));
  }
  .sign{
    display:flex;align-items:center;gap:14px;margin-top:38px;
  }
  .date{
    font-size:11.5px;letter-spacing:.26em;
    color:rgba(226,195,139,.55);
  }

  /* ---------- 上滑提示 ---------- */
  .chev{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);
    display:flex;flex-direction:column;align-items:center;gap:7px;
    color:rgba(226,195,139,.6);font-size:11px;letter-spacing:.34em;text-indent:.34em;
    opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:6;
  }
  .chev.show{opacity:1}
  .chev i{
    display:block;width:1px;height:24px;
    background:linear-gradient(to bottom, rgba(226,195,139,0), rgba(226,195,139,.75));
    animation:drop 2.2s ease-in-out infinite;
  }
  @keyframes drop{
    0%,100%{opacity:.25;transform:translateY(-5px)}
    50%{opacity:.95;transform:translateY(2px)}
  }

  /* ---------- 音乐按钮 ---------- */
  .sound{
    position:fixed;z-index:7;
    top:calc(env(safe-area-inset-top) + 14px);right:14px;
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);border:1px solid rgba(226,195,139,.32);
    background:rgba(8,18,30,.42);
    opacity:0;pointer-events:none;
    transition:opacity .8s ease .9s, border-color .3s, transform .2s;
    font-size:15px;line-height:1;padding:0;
    -webkit-appearance:none;appearance:none;cursor:pointer;
  }
  body.open .sound{opacity:.85;pointer-events:auto}
  .sound::after{content:"";position:absolute;width:19px;height:1.5px;border-radius:2px;
    background:currentColor;transform:rotate(-45deg);opacity:0;transition:opacity .3s}
  body.muted .sound::after{opacity:1}
  body.muted .sound{opacity:.4}
  .sound:active{transform:scale(.93)}

  canvas#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.2s!important}
  }
  body.noanim *{transition:none!important;animation:none!important}
</style>
</head>

<script>
(function(){
  var body = document.body;
  var sc = document.getElementById('sc');
  var chev = document.getElementById('chev');
  if (location.search.indexOf('open') > -1) { body.classList.add('noanim','open'); }

  var opened = false;
  function sync(){
    var i = Math.round(sc.scrollTop / Math.max(1, sc.clientHeight));
    chev.classList.toggle('show', opened && i < 3);
  }
  function open(){
    if (opened) return;
    opened = true;
    body.classList.add('open');
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }
    if (window.__audio) { try { window.__audio.start(); } catch(e){} }
    setTimeout(sync, 60);
  }
  document.addEventListener('click', open, {passive:true});
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  sc.addEventListener('scroll', sync, {passive:true});
  window.addEventListener('resize', sync);

  var pm = location.search.match(/[?&]p=(\d)/);
  if (pm) {
    open();
    body.classList.add('noanim');
    sc.style.scrollBehavior = 'auto';
    sc.scrollTop = (parseInt(pm[1], 10) - 1) * sc.clientHeight;
  }

  var img = document.getElementById('card');
  if (!img.complete) { img.addEventListener('load', function(){ body.classList.add('ready'); }); }

  /* ---------- 雪 ---------- */
  var cv = document.getElementById('snow'), ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, flakes = [];
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var n = Math.round(Math.min(70, Math.max(30, W / 7)));
    flakes = [];
    for (var i=0;i<n;i++) flakes.push(newFlake(true));
  }
  function newFlake(init){
    return {
      x: Math.random()*W,
      y: init ? Math.random()*H : -10,
      r: 0.6 + Math.random()*2.0,
      vy: 0.22 + Math.random()*0.55,
      vx: (Math.random()-0.5)*0.22,
      a: 0.12 + Math.random()*0.42,
      ph: Math.random()*Math.PI*2
    };
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<flakes.length;i++){
      var f = flakes[i];
      if (!reduce){
        f.y += f.vy; f.x += f.vx + Math.sin(t/2600 + f.ph)*0.16;
        if (f.y > H + 8 || f.x < -12 || f.x > W + 12) flakes[i] = newFlake(false);
      }
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(230,240,252,' + f.a + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(draw);
})();
</script>

<script>
/* ---------- 音乐：Web Audio 实时合成，无音频文件 ---------- */
(function(){
  var AC = window.AudioContext || window.webkitAudioContext;
  var btn = document.getElementById('soundBtn');
  if (!AC) { if (btn) btn.style.display = 'none'; return; }

  var ctx = null, master = null, started = false, muted = false;
  var timer = null, step = 0, nextTime = 0;
  var D4 = 293.66;
  var mel = [0,3,7,10,12,10,7,3, 0,7,10,14,12,10,7,3];
  var STEP = 0.95;

  function hz(semi){ return D4 * Math.pow(2, semi / 12); }

  function impulse(sec, decay){
    var rate = ctx.sampleRate, len = Math.floor(rate * sec);
    var buf = ctx.createBuffer(2, len, rate);
    for (var c = 0; c < 2; c++){
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function note(t, freq, dur, vel){
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    var parts = [[1, 1], [2.003, 0.16], [3.004, 0.05]];
    for (var i = 0; i < parts.length; i++){
      var o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * parts[i][0];
      og.gain.value = parts[i][1];
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + dur + 0.05);
    }
    g.connect(master);
  }

  function wind(){
    var len = ctx.sampleRate * 4;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0), last = 0;
    for (var i = 0; i < len; i++){
      var w = Math.random() * 2 - 1;
      last = last * 0.97 + w * 0.03;
      d[i] = last * 6;
    }
    var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    var g = ctx.createGain(); g.gain.value = 0.05;
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start();

    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.06;
    var lg = ctx.createGain(); lg.gain.value = 0.025;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
  }

  function schedule(){
    while (nextTime < ctx.currentTime + 1.2){
      var i = step % mel.length;
      if (i === 0 || Math.random() > 0.10){
        note(nextTime, hz(mel[i]), 2.9, 0.14 + Math.random() * 0.05);
      }
      if (i % 8 === 0){
        note(nextTime, hz(-12), 5.0, 0.10);
        note(nextTime, hz(-5), 5.0, 0.05);
      }
      step++;
      nextTime += STEP * (0.97 + Math.random() * 0.06);
    }
  }

  function start(){
    if (started){
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return;
    }
    started = true;
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = 0;
    master.gain.linearRampToValueAtTime(0.7, ctx.currentTime + 4);

    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3;

    var verb = ctx.createConvolver(); verb.buffer = impulse(2.8, 2.2);
    var wet = ctx.createGain(); wet.gain.value = 0.5;
    var dry = ctx.createGain(); dry.gain.value = 0.6;

    master.connect(comp);
    comp.connect(dry); dry.connect(ctx.destination);
    comp.connect(verb); verb.connect(wet); wet.connect(ctx.destination);

    wind();
    nextTime = ctx.currentTime + 0.15;
    schedule();
    timer = setInterval(schedule, 250);
    if (ctx.state === 'suspended') ctx.resume();
  }

  function toggle(){
    if (!started){ start(); return; }
    muted = !muted;
    document.body.classList.toggle('muted', muted);
    var t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(muted ? 0 : 0.7, t + 0.6);
    if (!muted && ctx.state === 'suspended') ctx.resume();
  }

  if (btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });
    btn.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); toggle(); }
    });
  }

  document.addEventListener('visibilitychange', function(){
    if (!started || !ctx) return;
    if (document.hidden){ if (ctx.state === 'running') ctx.suspend(); }
    else if (!muted && ctx.state === 'suspended'){ ctx.resume(); }
  });

  window.__audio = { start: start, toggle: toggle };
})();
</script>
</body>
</html>
