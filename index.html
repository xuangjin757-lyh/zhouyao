<style>
  :root{
    --gold:#e2c38b;
    --cream:#efe6d6;
    --ink:#0a1522;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(78% 52% at 82% 4%, rgba(150,186,228,.18), rgba(0,0,0,0) 62%),
      radial-gradient(62% 46% at 10% 98%, rgba(206,150,86,.17), rgba(0,0,0,0) 66%),
      radial-gradient(95% 70% at 50% 42%, rgba(88,120,158,.10), rgba(0,0,0,0) 72%),
      linear-gradient(180deg,#050a12 0%,#0a1624 32%,#0f2031 64%,#15293b 100%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  /* 极光：两条窄带，贴着天际，向下淡出 */
  .aurora{
    position:fixed;left:-34%;right:-30%;top:-8%;height:64vh;z-index:0;pointer-events:none;
    background:repeating-linear-gradient(96deg,
      rgba(120,255,225,0) 0 34px, rgba(120,255,225,.06) 34px 54px, rgba(120,255,225,0) 54px 92px);
    filter:blur(26px) saturate(1.35);
    mix-blend-mode:screen;
    opacity:.9;
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.8) 32%, rgba(0,0,0,.3) 58%, rgba(0,0,0,0) 88%);
    mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.8) 32%, rgba(0,0,0,.3) 58%, rgba(0,0,0,0) 88%);
    animation:aur 22s ease-in-out infinite alternate;
    will-change:opacity,transform;
  }
  .aurora::before,.aurora::after{
    content:"";position:absolute;left:-6%;right:-6%;border-radius:50%;
  }
  .aurora::before{
    top:1%;height:26vh;
    background:linear-gradient(90deg,
      rgba(40,200,160,0) 0%, rgba(46,232,180,.30) 24%,
      rgba(78,214,228,.24) 52%, rgba(96,150,240,.14) 74%, rgba(96,150,240,0) 90%);
    transform:rotate(-6deg);
  }
  .aurora::after{
    top:17%;height:19vh;
    background:linear-gradient(90deg,
      rgba(96,150,240,0) 6%, rgba(104,188,236,.20) 34%,
      rgba(158,128,230,.20) 64%, rgba(158,128,230,0) 88%);
    transform:rotate(-9deg);
  }
  @keyframes aur{
    0%{opacity:.62;transform:translate3d(-2%,0,0) scale(1)}
    50%{opacity:.92}
    100%{opacity:.70;transform:translate3d(2%,1%,0) scale(1.04)}
  }
  /* 月亮：正好托住右上角的音符 */
  .moon{
    position:fixed;top:4%;right:7%;width:30vmin;height:30vmin;z-index:0;pointer-events:none;
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(244,249,255,.34) 0%, rgba(232,242,255,.16) 16%, rgba(214,230,250,.08) 38%, rgba(214,230,250,0) 66%);
    filter:blur(13px);
    opacity:.85;
  }
  /* 远处的路灯：画面下缘的虚焦光斑 */
  .lights{position:fixed;inset:0;z-index:0;pointer-events:none}
  .lights i{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, rgba(255,206,150,.65) 0%, rgba(255,190,120,.22) 42%, rgba(255,190,120,0) 70%);
    filter:blur(9px);
  }
  .lights i:nth-child(1){left:4%;bottom:-2%;width:9vmin;height:9vmin;opacity:.42}
  .lights i:nth-child(2){left:19%;bottom:-4%;width:5.5vmin;height:5.5vmin;opacity:.32}
  .lights i:nth-child(3){right:6%;bottom:-3%;width:7vmin;height:7vmin;opacity:.36}

  body::before{
    content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
    background-size:140px 140px;
    opacity:0;
  }
  @supports (mix-blend-mode: overlay){
    body::before{opacity:.16;mix-blend-mode:overlay}
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(75% 65% at 50% 45%, transparent 45%, rgba(3,8,14,.60) 100%);
  }

  /* ---------- 滚动容器 ---------- */
  .scroller{
    position:fixed;inset:0;
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    z-index:2;
  }
  body:not(.open) .scroller{overflow:hidden}

  .page{
    position:relative;
    height:100vh;height:100dvh;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    scroll-snap-align:center;scroll-snap-stop:always;
    padding:16px;
  }
  .page.last{gap:8px}
  /* 每页一点色温差：从冷走到灯下 */
  .page:nth-child(1){background:radial-gradient(80% 60% at 50% 102%, rgba(190,150,100,.05), rgba(0,0,0,0) 70%)}
  .page:nth-child(2){background:radial-gradient(80% 60% at 50% 110%, rgba(110,160,210,.07), rgba(0,0,0,0) 72%)}
  .page:nth-child(3){background:radial-gradient(80% 60% at 50% 110%, rgba(210,150,95,.08), rgba(0,0,0,0) 72%)}
  .page:nth-child(4){background:radial-gradient(80% 65% at 50% 105%, rgba(220,205,180,.06), rgba(0,0,0,0) 75%)}
  /* 每一页底部一层极淡的“雪地反光”，让画面有地面 */
  .page::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:30vh;
    background:linear-gradient(to top, rgba(206,226,246,.075), rgba(206,226,246,0));
    pointer-events:none;
  }

  /* ---------- 第一页：信 ---------- */
  .glow{
    position:absolute;width:96vmin;height:96vmin;border-radius:50%;
    background:radial-gradient(circle, rgba(224,182,124,.20), rgba(224,182,124,0) 62%);
    filter:blur(22px);opacity:0;transition:opacity 1.4s ease .35s;
  }
  body.open .glow{opacity:1}

  .letter{
    display:block;
    max-width:88vw;max-height:70vh;max-height:70dvh;
    width:auto;height:auto;
    opacity:0;transform:translateY(16px) scale(.985);
    transition:opacity 1.2s ease .2s, transform 1.2s cubic-bezier(.19,.7,.25,1) .2s;
    filter:drop-shadow(0 12px 34px rgba(0,0,0,.45));
    will-change:opacity,transform;
  }
  body.open .letter{opacity:1;transform:none}

  .cover{
    position:absolute;inset:0;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .75s ease, transform .75s ease;
  }
  body.open .cover{opacity:0;transform:scale(1.04);pointer-events:none}

  .eyebrow{
    font-size:13px;letter-spacing:.42em;text-indent:.42em;
    color:var(--gold);opacity:.92;margin-bottom:34px;
    text-shadow:0 1px 14px rgba(0,0,0,.65), 0 0 3px rgba(0,0,0,.5);
  }

  .seal{
    width:84px;height:84px;border-radius:5px;
    background:linear-gradient(150deg,#b03a31,#8e2a24);
    color:#fbf1e2;font-family:"STXingkai","华文行楷","Kaiti SC","KaiTi",serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:27px;line-height:1.02;letter-spacing:.04em;
    transform:rotate(-6deg);
    box-shadow:0 8px 26px rgba(140,40,30,.45), inset 0 0 22px rgba(0,0,0,.22);
    animation:breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:rotate(-6deg) scale(1);box-shadow:0 8px 26px rgba(140,40,30,.38), inset 0 0 22px rgba(0,0,0,.22)}
    50%{transform:rotate(-6deg) scale(1.045);box-shadow:0 12px 34px rgba(160,50,38,.5), inset 0 0 22px rgba(0,0,0,.22)}
  }
  .seal.small{
    width:54px;height:54px;font-size:17px;border-radius:4px;opacity:.85;
    animation:none;box-shadow:0 6px 16px rgba(0,0,0,.35);
  }

  .hint{
    margin-top:30px;font-size:14.5px;font-weight:500;letter-spacing:.3em;text-indent:.3em;
    color:rgba(247,232,203,.96);
    text-shadow:0 1px 10px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.7);
    animation:fade 3.6s ease-in-out infinite;
  }
  @keyframes fade{0%,100%{opacity:.45}50%{opacity:.95}}

  .after{
    position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 96px);
    text-align:center;font-size:12.5px;letter-spacing:.22em;
    color:rgba(226,195,139,.62);
    opacity:0;transform:translateY(8px);
    transition:opacity 1s ease 1.05s, transform 1s ease 1.05s;
    z-index:3;pointer-events:none;
  }
  body.open .after{opacity:1;transform:none}

  /* ---------- 短章页 ---------- */
  .verse{
    display:block;
    max-width:80vw;max-height:64vh;
    max-height:64dvh;
    width:auto;height:auto;
    filter:drop-shadow(0 6px 26px rgba(0,0,0,.5));
  }
  .sign{
    display:flex;align-items:center;gap:14px;margin-top:38px;
  }
  .date{
    font-size:11.5px;letter-spacing:.26em;
    color:rgba(226,195,139,.55);
  }

  /* ---------- 上滑提示 ---------- */
  .chev{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);
    display:flex;flex-direction:column;align-items:center;gap:7px;
    color:rgba(226,195,139,.6);font-size:11px;letter-spacing:.34em;text-indent:.34em;
    opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:6;
  }
  .chev.show{opacity:1}
  .chev i{
    display:block;width:1px;height:24px;
    background:linear-gradient(to bottom, rgba(226,195,139,0), rgba(226,195,139,.75));
    animation:drop 2.2s ease-in-out infinite;
  }
  @keyframes drop{
    0%,100%{opacity:.25;transform:translateY(-5px)}
    50%{opacity:.95;transform:translateY(2px)}
  }

  /* ---------- 音乐按钮 ---------- */
  .sound{
    position:fixed;z-index:7;
    top:calc(env(safe-area-inset-top) + 14px);right:14px;
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);border:1px solid rgba(226,195,139,.32);
    background:rgba(8,18,30,.42);
    opacity:0;pointer-events:none;
    transition:opacity .8s ease .9s, border-color .3s, transform .2s;
    font-size:15px;line-height:1;padding:0;
    -webkit-appearance:none;appearance:none;cursor:pointer;
  }
  body.open .sound{opacity:.85;pointer-events:auto}
  .sound::after{content:"";position:absolute;width:19px;height:1.5px;border-radius:2px;
    background:currentColor;transform:rotate(-45deg);opacity:0;transition:opacity .3s}
  body.muted .sound::after{opacity:1}
  body.muted .sound{opacity:.4}
  .sound:active{transform:scale(.93)}

  canvas#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.2s!important}
  }
  body.noanim *{transition:none!important;animation:none!important}
</style>
</head>

<script>
(function(){
  var body = document.body;
  var sc = document.getElementById('sc');
  var chev = document.getElementById('chev');
  if (location.search.indexOf('open') > -1) { body.classList.add('noanim','open'); }

  var opened = false;
  function sync(){
    var i = Math.round(sc.scrollTop / Math.max(1, sc.clientHeight));
    chev.classList.toggle('show', opened && i < 4);
  }
  function open(){
    if (opened) return;
    opened = true;
    body.classList.add('open');
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }
    if (window.__audio) { try { window.__audio.start(); } catch(e){} }
    setTimeout(sync, 60);
  }
  document.addEventListener('click', open, {passive:true});
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  sc.addEventListener('scroll', sync, {passive:true});
  window.addEventListener('resize', sync);

  var pm = location.search.match(/[?&]p=(\d)/);
  if (pm) {
    open();
    body.classList.add('noanim');
    sc.style.scrollBehavior = 'auto';
    sc.scrollTop = (parseInt(pm[1], 10) - 1) * sc.clientHeight;
  }

  var img = document.getElementById('card');
  if (!img.complete) { img.addEventListener('load', function(){ body.classList.add('ready'); }); }

  /* ---------- 雪 ---------- */
  var cv = document.getElementById('snow'), ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, flakes = [], near = [];
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 近处的雪：大颗、虚焦，制造景深
  var sprite = (function(){
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'rgba(255,255,255,1)');
    gr.addColorStop(.38,'rgba(255,255,255,.42)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0,0,64,64);
    return c;
  })();

  function newNear(init){
    return {
      x: Math.random()*W,
      y: init ? Math.random()*H : -40,
      r: 6 + Math.random()*6,
      vy: 0.12 + Math.random()*0.18,
      vx: (Math.random()-0.5)*0.10,
      a: 0.03 + Math.random()*0.035,
      ph: Math.random()*Math.PI*2
    };
  }

  function resize(){
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var n = Math.round(Math.min(70, Math.max(30, W / 7)));
    flakes = [];
    for (var i=0;i<n;i++) flakes.push(newFlake(true));
    near = [];
    for (var j=0;j<5;j++) near.push(newNear(true));
  }
  function newFlake(init){
    return {
      x: Math.random()*W,
      y: init ? Math.random()*H : -10,
      r: 0.6 + Math.random()*2.0,
      vy: 0.22 + Math.random()*0.55,
      vx: (Math.random()-0.5)*0.22,
      a: 0.12 + Math.random()*0.42,
      ph: Math.random()*Math.PI*2
    };
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<flakes.length;i++){
      var f = flakes[i];
      if (!reduce){
        f.y += f.vy; f.x += f.vx + Math.sin(t/2600 + f.ph)*0.16;
        if (f.y > H + 8 || f.x < -12 || f.x > W + 12) flakes[i] = newFlake(false);
      }
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(230,240,252,' + f.a + ')';
      ctx.fill();
    }
    // 虚焦的近雪
    for (var k=0;k<near.length;k++){
      var g = near[k];
      if (!reduce){
        g.y += g.vy; g.x += g.vx + Math.sin(t/3400 + g.ph)*0.10;
        if (g.y > H + 60 || g.x < -60 || g.x > W + 60) near[k] = newNear(false);
      }
      ctx.globalAlpha = g.a;
      ctx.drawImage(sprite, g.x - g.r, g.y - g.r, g.r*2, g.r*2);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(draw);
})();
</script>

<script>
/* ---------- 音乐：Web Audio 实时合成，无音频文件 ---------- */
(function(){
  var AC = window.AudioContext || window.webkitAudioContext;
  var btn = document.getElementById('soundBtn');
  if (!AC) { if (btn) btn.style.display = 'none'; return; }

  var ctx = null, master = null, started = false, muted = false;
  var timer = null, step = 0, nextTime = 0;
  var D4 = 293.66;
  var mel = [0,3,7,10,12,10,7,3, 0,7,10,14,12,10,7,3];
  var STEP = 0.95;

  function hz(semi){ return D4 * Math.pow(2, semi / 12); }

  function impulse(sec, decay){
    var rate = ctx.sampleRate, len = Math.floor(rate * sec);
    var buf = ctx.createBuffer(2, len, rate);
    for (var c = 0; c < 2; c++){
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function note(t, freq, dur, vel){
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    var parts = [[1, 1], [2.003, 0.16], [3.004, 0.05]];
    for (var i = 0; i < parts.length; i++){
      var o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * parts[i][0];
      og.gain.value = parts[i][1];
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + dur + 0.05);
    }
    g.connect(master);
  }

  function wind(){
    var len = ctx.sampleRate * 4;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0), last = 0;
    for (var i = 0; i < len; i++){
      var w = Math.random() * 2 - 1;
      last = last * 0.97 + w * 0.03;
      d[i] = last * 6;
    }
    var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    var g = ctx.createGain(); g.gain.value = 0.05;
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start();

    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.06;
    var lg = ctx.createGain(); lg.gain.value = 0.025;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
  }

  function schedule(){
    while (nextTime < ctx.currentTime + 1.2){
      var i = step % mel.length;
      if (i === 0 || Math.random() > 0.10){
        note(nextTime, hz(mel[i]), 2.9, 0.14 + Math.random() * 0.05);
      }
      if (i % 8 === 0){
        note(nextTime, hz(-12), 5.0, 0.10);
        note(nextTime, hz(-5), 5.0, 0.05);
      }
      step++;
      nextTime += STEP * (0.97 + Math.random() * 0.06);
    }
  }

  function start(){
    if (started){
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return;
    }
    started = true;
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = 0;
    master.gain.linearRampToValueAtTime(0.7, ctx.currentTime + 4);

    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3;

    var verb = ctx.createConvolver(); verb.buffer = impulse(2.8, 2.2);
    var wet = ctx.createGain(); wet.gain.value = 0.5;
    var dry = ctx.createGain(); dry.gain.value = 0.6;

    master.connect(comp);
    comp.connect(dry); dry.connect(ctx.destination);
    comp.connect(verb); verb.connect(wet); wet.connect(ctx.destination);

    wind();
    nextTime = ctx.currentTime + 0.15;
    schedule();
    timer = setInterval(schedule, 250);
    if (ctx.state === 'suspended') ctx.resume();
  }

  function toggle(){
    if (!started){ start(); return; }
    muted = !muted;
    document.body.classList.toggle('muted', muted);
    var t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(muted ? 0 : 0.7, t + 0.6);
    if (!muted && ctx.state === 'suspended') ctx.resume();
  }

  if (btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });
    btn.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); toggle(); }
    });
  }

  document.addEventListener('visibilitychange', function(){
    if (!started || !ctx) return;
    if (document.hidden){ if (ctx.state === 'running') ctx.suspend(); }
    else if (!muted && ctx.state === 'suspended'){ ctx.resume(); }
  });

  window.__audio = { start: start, toggle: toggle };
})();
</script>
